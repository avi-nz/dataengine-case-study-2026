version: 2

models:
  - name: stg_weather__observations
    description: >
      One row per weather reading for New York City. Unpacked from raw JSON,
      converted to Celsius and New York local time.
    columns:
      - name: observation_id
        description: Hash of city id + reading time.
        data_tests:
          - unique
          - not_null
      - name: city_id
        data_tests:
          - accepted_values:
              arguments:
                values: [5128581]
      - name: observed_at_nyc
        data_tests:
          - not_null
      - name: temp_c
        description: Temperature in °C (converted from Kelvin).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -40
                max_value: 50