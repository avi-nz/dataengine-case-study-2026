version: 2

models:
  - name: stg_citibike__trips
    description: >
      One row per Citibike trip, 2013-06 to 2018-06. Typed, renamed, and deduplicated
      on bike + start time.
    columns:
      - name: trip_id
        description: Hash of bike id + start time.
        data_tests:
          - unique
          - not_null
      - name: started_at
        data_tests:
          - not_null
      - name: trip_duration_seconds
        description: Citibike already removed trips under 60 seconds before publishing.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 60
      - name: user_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['member', 'casual', 'unknown']